# Post diário no blog: todo dia às 06:00 (horário de Brasília)
# Usa Reddit r/running + OpenAI para gerar o conteúdo e faz commit em content/blog/

name: Daily blog post

on:
  schedule:
    # 06:00 BRT = 09:00 UTC (ajuste o cron se mudar fuso)
    - cron: "0 9 * * *"
  workflow_dispatch: # Permite rodar manualmente em Actions > Daily blog post > Run workflow

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para git push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Generate post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-daily-post.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/
          git diff --staged --quiet || {
            git commit -m "blog: post diário automático $(date +%Y-%m-%d)"
            git push
          }
